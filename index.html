<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
/* Layout: fixed frame on a 5 by 5 grid of hairlines. Corners: NYC clock, [ROD LARRAIN], LinkedIn, mode toggle, language.
   Center: About / Work / Contact stacked; each opens in place like an accordion and the stack recenters.
   Motion: lines draw in, mono labels decode, panels unfold, images wipe in, carousel glides. Dark first, own light toggle. */
:root{color-scheme:dark;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"DM Sans","Helvetica Neue",Helvetica,Arial,sans-serif;--ease:cubic-bezier(.16,.84,.24,1)}
#app{--bg:#131313;--fg:#e9e9e9;--text:#c6c6c6;--muted:#858585;--line:rgba(255,255,255,.055)}
#app[data-mode="light"]{--bg:#efefef;--fg:#141414;--text:#383838;--muted:#7a7a7a;--line:rgba(0,0,0,.07)}
html,body{margin:0;height:100%;background:#131313}
*{box-sizing:border-box}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background-color .7s var(--ease),color .7s var(--ease)}
html{-webkit-text-size-adjust:100%}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;text-transform:inherit}
a{color:inherit}
:focus-visible{outline:1px solid var(--fg);outline-offset:6px}
.mono{font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.42em;white-space:nowrap}

/* grid hairlines */
.lines{position:absolute;inset:0;pointer-events:none}
.lines i{position:absolute;background:var(--line);transition:transform 1.6s var(--ease),background-color .7s}
.lines .v{top:0;bottom:0;width:1px;transform:scaleY(0);transform-origin:top}
.lines .h{left:0;right:0;height:1px;transform:scaleX(0);transform-origin:left}
.ready .lines i{transform:none}

/* corners */
.corner{position:absolute;z-index:6;font-size:clamp(10px,.64vw,13px);opacity:0;transform:translateY(-6px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.ready .corner{opacity:1;transform:none}
.c-tl{top:calc(env(safe-area-inset-top,0px) + 7.6vh);left:3.2vw}
.c-tc{top:calc(env(safe-area-inset-top,0px) + 7.6vh);left:50%;transform:translate(-50%,-6px);font-size:clamp(12px,.86vw,17px)}
.ready .c-tc{transform:translate(-50%,0)}
.c-tr{top:calc(env(safe-area-inset-top,0px) + 7.6vh);right:5.1vw}
.c-bl{bottom:calc(env(safe-area-inset-bottom,0px) + 3.2vh);left:4.8vw;transform:translateY(6px)}
.c-br{bottom:calc(env(safe-area-inset-bottom,0px) + 4.2vh);right:5.5vw;transform:translateY(6px)}
.corner a,.corner button{opacity:.85;transition:opacity .25s;text-decoration:none}
.corner a:hover,.corner button:hover{opacity:1}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.toggle{width:clamp(28px,1.8vw,36px);height:clamp(28px,1.8vw,36px);display:block;transition:transform .9s var(--ease)}
.toggle circle{stroke:var(--fg);fill:none;stroke-width:1.6;transition:stroke .7s}
.toggle path{fill:var(--fg);transition:fill .7s}
#app[data-mode="light"] .toggle{transform:rotate(180deg)}

/* stack */
.stack{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;z-index:3}
.item{width:100%;display:flex;flex-direction:column;align-items:center}
.label{font-size:clamp(13px,.92vw,18px);padding:.85em 0;opacity:0;transform:translateY(10px);transition:opacity .9s var(--ease),transform .9s var(--ease),color .3s}
.ready .label{opacity:.9;transform:none}
.label:hover{opacity:1}
.item.open .label{opacity:1}
.panel{display:grid;grid-template-rows:0fr;width:100%;transition:grid-template-rows 1.1s var(--ease)}
.item.open .panel{grid-template-rows:1fr}
.panel>.in{overflow:hidden;min-height:0}
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform 1.1s var(--ease);transition-delay:calc(var(--d,0) * 90ms)}
.item.shown .rv{opacity:1;transform:none}

/* about */
.about{display:flex;justify-content:center;align-items:center;gap:2.8vw;padding:6vh 4vw 7vh}
.about .pic{width:16.6vw;min-width:150px;flex:none;aspect-ratio:332/400;overflow:hidden;clip-path:inset(100% 0 0 0);transition:clip-path 1.3s var(--ease) .15s}
.item.shown .about .pic{clip-path:inset(0)}
.about .pic img{width:100%;height:100%;object-fit:cover;object-position:52% 32%;filter:grayscale(1) contrast(1.05);display:block;transform:scale(1.15);transition:transform 2.2s var(--ease) .15s}
.item.shown .about .pic img{transform:none}
.about p{width:26vw;min-width:240px;margin:0;font-size:clamp(14px,.9vw,18px);line-height:1.78;color:var(--text)}
.about p+p{margin-left:1.5vw}

/* work */
.work{padding:1.5vh 0 4vh}
.stage{position:relative;height:20.2vw;touch-action:pan-y;user-select:none}
.w{position:absolute;top:50%;left:50%;width:10.4vw;aspect-ratio:4/3;overflow:hidden;transform:translate(-50%,-50%);cursor:pointer;
  transition:left 1s var(--ease),width 1s var(--ease),opacity .8s var(--ease),clip-path 1.2s var(--ease);clip-path:inset(0 0 100% 0)}
.item.shown .w{clip-path:inset(0)}
.w img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.12);transition:transform 1.6s var(--ease),filter .8s}
.w.r0 img{transform:scale(1)}
.w.r1{width:17vw}.w.r0{width:26.9vw;cursor:grab}
.w.out{opacity:0;pointer-events:none}
.w:not(.r0) img{filter:brightness(.82)}
.cap{text-align:center;width:min(88vw,450px);margin:3.4vh auto 0}
.cap .nm{font-size:clamp(13px,1.02vw,20px);margin:0;opacity:.92}
.cap .rl{font-size:clamp(13px,.8vw,15px);color:var(--text);margin:6px 0 22px}
.cap .ln{font-size:clamp(13px,.8vw,15px);line-height:1.75;color:var(--text);margin:0;transition:opacity .4s}
.cap .lk{display:inline-block;margin-top:8px;font-size:clamp(11px,.7vw,13px);color:var(--text);text-decoration:underline;text-underline-offset:3px;letter-spacing:.06em;text-transform:uppercase}
.cap.swap .ln,.cap.swap .rl,.cap.swap .lk{opacity:0}
.cap .ix{display:none;font-size:11px;color:var(--muted);margin:0 0 14px;letter-spacing:.3em}
.stage.drag .w{transition:none}

/* contact */
.contact{text-align:center;padding:1.5vh 0 5vh}
.contact .mail{font-size:clamp(17px,1.4vw,26px);margin:0 0 10px}
.contact .mail a{text-decoration:none;border-bottom:1px solid transparent;transition:border-color .25s}
.contact .mail a:hover{border-bottom-color:var(--fg)}
.contact .where{font-size:clamp(10px,.64vw,13px);color:var(--muted);text-decoration:none;padding-bottom:4px;border-bottom:1px solid var(--line);transition:color .25s,border-color .25s}
.contact .where:hover{color:var(--fg);border-bottom-color:var(--fg)}

/* first visit intro: brackets open on the name, then it flies up to the header */
.intro{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:var(--bg);cursor:default}
.intro .row{display:flex;align-items:center;font-size:clamp(12px,.86vw,17px);color:var(--fg);transform:scale(1.8);transition:transform 1.15s var(--ease)}
.intro .b{opacity:0;transition:opacity .6s var(--ease)}
.intro.on .b{opacity:1}
.intro .nm{display:inline-block;overflow:hidden;white-space:nowrap;width:0;transition:width 1.25s var(--ease)}
.intro .t{display:inline-block}

/* cursor */
.cur{position:absolute;z-index:30;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--fg);pointer-events:none;mix-blend-mode:difference;transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),opacity .3s;opacity:0}
.cur.big{width:44px;height:44px;margin:-22px 0 0 -22px}
@media (pointer:coarse){.cur{display:none}}

@media (max-width:760px){
  /* top: logo only. bottom: one row with toggle, clock, LinkedIn, language */
  .c-tc{top:calc(env(safe-area-inset-top,0px) + 22px);font-size:11px}
  .corner{font-size:9.5px;letter-spacing:.32em}
  .c-tl,.c-tr,.c-bl,.c-br{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);line-height:22px}
  .c-bl{left:20px;transform:none}.ready .c-bl{transform:none}
  .c-tl{left:31%;transform:translateX(-50%)}.ready .c-tl{transform:translateX(-50%)}
  .c-tr{left:auto;right:auto;left:66%;transform:translateX(-50%)}.ready .c-tr{transform:translateX(-50%)}
  .c-br{right:20px;transform:none}.ready .c-br{transform:none}
  .toggle{width:22px;height:22px}
  .corner a,.corner button{display:inline-block;padding:12px;margin:-12px}
  .c-bl button{display:block}
  /* menu always fully visible; open panel scrolls inside itself */
  .stack{top:calc(env(safe-area-inset-top,0px) + 62px);bottom:calc(env(safe-area-inset-bottom,0px) + 62px);transform:none;justify-content:center}
  .label{font-size:12px;padding:11px 28px}
  .item.open .panel>.in{max-height:calc(100dvh - 124px - 3 * 39px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
  .panel>.in::-webkit-scrollbar{display:none}
  .panel>.in.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 32px),transparent);mask-image:linear-gradient(#000 calc(100% - 32px),transparent)}
  .about{flex-direction:column;align-items:center;gap:16px;padding:6px 26px 14px}
  .about .pic{width:min(44vw,200px);min-width:0}
  .about p{width:auto;min-width:0;max-width:480px;font-size:13px;line-height:1.65}.about p+p{margin-left:0}
  .work{padding:4px 0 10px}
  .stage{height:56vw}.w{width:28vw}.w.r1{width:28vw}.w.r0{width:70vw}
  .w:not(.r0) img{filter:brightness(.6)}
  .cap{margin-top:16px;width:auto;padding:0 28px;max-width:480px}
  .cap .ix{display:block;font-size:9.5px;margin-bottom:10px}
  .cap .nm{font-size:11px;white-space:normal;line-height:1.7}
  .cap .rl{font-size:12px;margin:6px 0 12px}
  .cap .ln{font-size:13px;line-height:1.65}
  .contact{padding:4px 0 10px}
  .contact .mail{font-size:16px}.contact .where{font-size:9.5px;display:inline-block;padding:10px 4px}
}
@media (max-width:760px) and (max-height:700px){
  .stage{height:46vw}.w.r0{width:58vw}.w,.w.r1{width:24vw}
  .about .pic{width:min(34vw,150px)}
  .label{padding:9px 28px}
  .item.open .panel>.in{max-height:calc(100dvh - 124px - 3 * 33px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
}
@media (max-height:480px) and (orientation:landscape){
  .c-tl,.c-tr,.c-tc{top:calc(env(safe-area-inset-top,0px) + 14px)}
  .c-bl{bottom:12px}.c-br{bottom:18px}
  .stack{max-height:calc(100% - 96px);overflow-y:auto;scrollbar-width:none}
  .label{padding:8px 28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.cur{display:none}}
</style>

</head>

  </main>

</div>

  const h=[Math.max(4,y(st.top)-22),y(pin.top),y(pin.bottom),Math.min(H-4,y(st.bottom)+22)];
  let v=defV;
  if(open==='work'){const c=stage.querySelector('.r0');if(c){const r=c.getBoundingClientRect(),n1=stage.querySelectorAll('.r1');
    const a=n1[0]&&n1[0].getBoundingClientRect(),b=n1[1]&&n1[1].getBoundingClientRect();
    const xs=[x(r.left),x(r.right)];if(a&&b&&mob()){const L1=Math.min(a.right,b.right),R1=Math.max(a.left,b.left);v=[x(L1),xs[0],xs[1],x(R1)]}else if(a&&b){const l=Math.min(a.left,b.left),rr=Math.max(a.right,b.right);v=[x(l)-18,xs[0],xs[1],x(rr)+18]}else v=[defV[0],xs[0],xs[1],defV[3]]}}
  if(open==='about'){const pic=document.querySelector('.about .pic').getBoundingClientRect(),ps=document.querySelectorAll('.about p');
    if(ps.length===2&&innerWidth>760){const p1=ps[0].getBoundingClientRect(),p2=ps[1].getBoundingClientRect();v=[x(pic.left),x(pic.right)+(p1.left-pic.right)/2,x(p1.right)+(p2.left-p1.right)/2,x(p2.right)]}}
  return[v,h];
}
function follow(){const [tv,th]=targets(),k=reduce?1:.09;
  for(let i=0;i<4;i++){posV[i]+=(tv[i]-posV[i])*k;posH[i]+=(th[i]-posH[i])*k;VL[i].style.left=posV[i].toFixed(1)+'px';HL[i].style.top=posH[i].toFixed(1)+'px'}
  requestAnimationFrame(follow)}
requestAnimationFrame(follow);

/* clock */
function tick(){try{const s=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date()).replace(/\s?[AP]M/,'');const [hh,mm]=s.split(':');$('clock').innerHTML=`NYC ${hh}<span class="blink">:</span>${mm}`}catch(e){}}
tick();setInterval(tick,10000);

/* mode */
$('mode').onclick=()=>{const m=app.dataset.mode==='dark'?'light':'dark';app.dataset.mode=m;document.documentElement.style.background=m==='dark'?'#131313':'#efefef';document.documentElement.style.colorScheme=m};

/* carousel */
const stage=$('stage'),cap=$('cap');let cur=2;
CASES.forEach((c,k)=>{const b=document.createElement('button');b.className='w';b.setAttribute('aria-label',c.name);
  b.innerHTML=`<img src="${c.img}" alt="" draggable="false">`;b.onclick=()=>{if(k!==cur)setCur(k)};stage.appendChild(b)});
const X={'-2':10.6,'-1':26.1,'0':50,'1':73.6,'2':89},XM={'-1':-6,'0':50,'1':106};
const mob=()=>innerWidth<=760;
function place(){const m=mob(),P=m?XM:X;
  [...stage.children].forEach((el,k)=>{let r=((k-cur)%N+N)%N;if(r>N/2)r-=N;const a=Math.abs(r),lim=m?1:2;
    el.className='w'+(a===0?' r0':a===1?' r1':a<=lim?'':' out');
    el.style.left=(P[r]!==undefined?P[r]:(r<0?(m?-40:-8):(m?140:108)))+'vw';el.tabIndex=a<=lim?0:-1})}
addEventListener('resize',()=>{if(stage.children.length)place()});
{const chk=()=>document.querySelectorAll('.panel>.in').forEach(el=>el.classList.toggle('more',el.scrollHeight-el.scrollTop-el.clientHeight>8));document.querySelectorAll('.panel>.in').forEach(el=>el.addEventListener('scroll',chk,{passive:true}));setInterval(chk,400)}
function layout(first){
  place();
  [...stage.children].forEach((el,k)=>{let r=((k-cur)%N+N)%N;if(r>N/2)r-=N;
    el.style.transitionDelay=first?`left 0s, width 0s, opacity 0s, clip-path ${0.15+(r+2)*0.08}s`:'';
    if(first)el.style.transitionDelay=`0s,0s,0s,${0.2+(Math.max(-2,Math.min(2,r))+2)*0.09}s`;});
  renderCap();
}
function renderCap(){
  const c=CASES[cur],city=lang==='es'?(CITY[c.city]||c.city):c.city,role=lang==='es'?(ROLE[c.role]||c.role):c.role;
  if(!cap.firstChild){cap.innerHTML='<p class="ix mono"></p><p class="nm mono"></p><p class="rl"></p><p class="ln"></p><a class="lk"></a>'}
  cap.querySelector('.ix').textContent=String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
  cap.classList.add('swap');
  scramble(cap.querySelector('.nm'),(c.name+'  '+city).toUpperCase(),520);
  setTimeout(()=>{cap.querySelector('.rl').textContent=role;cap.querySelector('.ln').textContent=c[lang];
    const lk=cap.querySelector('.lk');if(c.url){lk.href=c.url;lk.textContent=T[lang].link;lk.hidden=false}else{lk.hidden=true;lk.removeAttribute('href')}
    cap.classList.remove('swap')},260);
}
function setCur(k){cur=(k+N)%N;layout();try{if(open==='work')history.replaceState(null,'','#'+CASES[cur].id)}catch(e){}}
let sx=null,sy=0;stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointermove',e=>{if(sx===null||e.pointerType==='mouse')return;const dx=e.clientX-sx;
  if(Math.abs(dx)>6){stage.classList.add('drag');stage.style.transform=`translateX(${dx*.45}px)`}});
function endDrag(){stage.classList.remove('drag');stage.style.transition='transform .6s var(--ease)';stage.style.transform='';setTimeout(()=>stage.style.transition='',600)}
addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;endDrag();
  if(open==='work'&&Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))setCur(cur+(dx<0?1:-1))});
addEventListener('pointercancel',()=>{if(sx!==null){sx=null;endDrag()}});
let lock=0;stage.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)||Math.abs(e.deltaX)<10||Date.now()<lock)return;lock=Date.now()+650;setCur(cur+(e.deltaX>0?1:-1))},{passive:true});

/* accordion */
let open=null;
function setOpen(k,caseId){
  if(open===k&&!caseId)k=null;
  open=k;
  ['about','work','contact'].forEach(n=>{const it=$('i-'+n),on=n===k;it.classList.toggle('open',on);
    if(on){setTimeout(()=>it.classList.add('shown'),reduce?0:140)}else it.classList.remove('shown')});
  document.querySelectorAll('.panel>.in').forEach(el=>el.scrollTop=0);
  if(k==='work'){if(caseId)cur=CASES.findIndex(c=>c.id===caseId);[...stage.children].forEach(el=>el.style.transitionDelay='');layout(true)}
  try{history.replaceState(null,'',!k?location.pathname:'#'+(k==='work'?CASES[cur].id:k))}catch(e){}
}
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');if(o){setOpen(o.dataset.open);return}
  if(e.target.closest('[data-close]'))setOpen(null);
});
document.addEventListener('keydown',e=>{if(open==='work'){if(e.key==='ArrowRight')setCur(cur+1);if(e.key==='ArrowLeft')setCur(cur-1)}if(e.key==='Escape')setOpen(null)});

/* language */
function applyLang(animate){
  const t=T[lang];
  document.querySelectorAll('[data-k]').forEach(el=>{const v=t[el.dataset.k];if(v===undefined)return;
    if(el.classList.contains('mono')&&animate)scramble(el,v.toUpperCase(),600);else setTxt(el,v)});
  const lb=$('lang');animate?scramble(lb,t.lang.toUpperCase(),400):setTxt(lb,t.lang);
  lb.setAttribute('aria-label',lang==='en'?'Cambiar a español':'Switch to English');
  document.documentElement.lang=lang;
  if(cap.firstChild)renderCap();
}
$('lang').onclick=()=>{lang=lang==='en'?'es':'en';applyLang(true)};
applyLang(false);

/* hover decode on mono links */
if(matchMedia('(hover:hover)').matches)document.querySelectorAll('.label,.corner a,.c-tc button').forEach(el=>el.addEventListener('mouseenter',()=>{if(el._busy)return;el._busy=1;scramble(el,(el._t||el.textContent).toUpperCase(),420);setTimeout(()=>el._busy=0,450)}));

/* cursor */
const cu=$('cur');let mx=-100,my=-100,cx=-100,cy=-100;
if(!reduce&&matchMedia('(pointer:fine)').matches){
  addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;cu.style.opacity=1;cu.classList.toggle('big',!!e.target.closest('button,a'))});
  (function loop(){cx+=(mx-cx)*.2;cy+=(my-cy)*.2;cu.style.transform=`translate(${cx}px,${cy}px)`;requestAnimationFrame(loop)})();
}

/* intro */
const h=location.hash.slice(1);
function startMain(fromIntro){
  app.classList.add('ready');
  if(!reduce){document.querySelectorAll('.label').forEach((el,i)=>setTimeout(()=>scramble(el,(el._t||el.textContent).toUpperCase(),700),500+i*120));
    if(!fromIntro)scramble(document.querySelector('.c-tc button'),'[ROD  LARRAIN]',900)}
  if(['about','work','contact'].includes(h))setTimeout(()=>setOpen(h),reduce?0:900);
  else if(CASES.some(c=>c.id===h))setTimeout(()=>setOpen('work',h),reduce?0:900);
}
function runIntro(){
  try{localStorage.setItem('rl_intro','1')}catch(e){}
  const tc=document.querySelector('.c-tc');
  const ov=document.createElement('div');ov.className='intro';ov.setAttribute('aria-hidden','true');
  ov.innerHTML='<div class="row mono"><span class="b">[</span><span class="nm"><span class="t">ROD  LARRAIN</span></span><span class="b">]</span></div>';
  app.appendChild(ov);
  const row=ov.querySelector('.row'),nm=ov.querySelector('.nm'),t=ov.querySelector('.t');
  let finished=false;const timers=[];
  function finish(){if(finished)return;finished=true;timers.forEach(clearTimeout);
    tc.style.transition='none';tc.style.opacity='1';tc.style.transform='translate(-50%,0)';
    ov.remove();startMain(true);
    setTimeout(()=>{tc.style.transition='';tc.style.opacity='';tc.style.transform=''},60)}
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    ov.classList.add('on');
    timers.push(setTimeout(()=>{nm.style.width=t.offsetWidth+'px';scramble(t,'ROD  LARRAIN',1150)},700));
    timers.push(setTimeout(()=>{const r=tc.querySelector('button').getBoundingClientRect(),ar=app.getBoundingClientRect();
      const dy=(r.top+6+r.height/2)-(ar.top+ar.height/2);row.style.transform=`translateY(${dy}px) scale(1)`},2450));
    timers.push(setTimeout(finish,3650));
  }));
  ov.addEventListener('click',finish);addEventListener('keydown',finish,{once:true});
}
let seen=false;try{seen=localStorage.getItem('rl_intro')==='1'}catch(e){}
if(reduce||seen||h)requestAnimationFrame(()=>requestAnimationFrame(()=>startMain(false)));
else runIntro();
</script>
